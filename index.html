<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17181a">
  <title>麦穗与羊</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main id="reader" aria-label="PDF reader">
    <div id="stage">
      <div id="message" role="status" aria-live="polite">Loading document…</div>
      <canvas id="pdf-canvas" aria-label="PDF page"></canvas>
    </div>

    <div id="zoom-control" class="floating-control" aria-label="Zoom controls">
      <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
      <span id="zoom-level">Fit</span>
      <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
    </div>

    <div id="page-control" class="floating-control" aria-label="Page navigation">
      <button id="prev-page" type="button" aria-label="Previous page" title="Previous page">‹</button>
      <button id="page-index" type="button" aria-label="Choose page" title="Jump to page">
        <span id="current-page">1</span><span class="index-separator">/</span><span id="total-pages">—</span>
      </button>
      <button id="next-page" type="button" aria-label="Next page" title="Next page">›</button>
    </div>

    <form id="page-jump" aria-label="Jump to page" hidden>
      <label for="page-input">Go to page</label>
      <input id="page-input" type="number" min="1" step="1" inputmode="numeric" autocomplete="off">
      <button type="submit">Go</button>
    </form>
  </main>
</body>
</html>
