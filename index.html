<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202124">
  <title>麦穗与羊 | 死在十七岁的你</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="toolbar" aria-label="PDF controls">
    <button id="prev" type="button" aria-label="Previous page" title="Previous page">‹</button>
    <span class="page-status"><input id="page-number" type="number" min="1" value="1" aria-label="Current page"><span>/</span><span id="page-count">—</span></span>
    <button id="next" type="button" aria-label="Next page" title="Next page">›</button>
    <span class="divider"></span>
    <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
    <span id="zoom-level">100%</span>
    <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
    <button id="fit-width" type="button" title="Fit width">Fit</button>
  </header>

  <main id="viewer" aria-label="PDF document">
    <div id="message">加载中…</div>
    <div id="pages"></div>
  </main>

  <script>
    // PDF.js is loaded as an ES module by app.js.
  </script>
</body>
</html>
